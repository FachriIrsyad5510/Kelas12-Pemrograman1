<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pading dan table</title>
    <style>
        table {
            background-color: #04aa6d;
            color: white;
        }
        td {
            padding: 8px;
        }
        tr {
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        tr:nth-child(even) {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>kolom 1, baris1</td>
            <td>kolom 2, baris1</td>
        </tr>
        <tr>
            <td>kolom 1, baris2</td>
            <td>kolom 2, baris2</td>
        </tr>
        <tr>
            <td>kolom 1, baris3</td>
            <td>kolom 2, baris3</td>
        </tr>
    </table>
    </body>
</html>
