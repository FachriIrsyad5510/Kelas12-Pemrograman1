<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Dan Selector</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }

        .special {
            background-color: #e74c3c;
        }

        #unique {
            background-color: #27ae60;

        }

        .container p {
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>Css Grid dan Selector</h1>
    <div class="container">
        <div class="item">item 1</div>
        <div class="item">item 2</div>
        <div class="item special">item 3 (Spesiac)</div>
        <div class="item">item 4</div>
        <div class="item">item 5</div>
        <div class="item" id="unique">item 6 (Unique)</div>
    </div>
    <p>Ini adalah Contoh text dalam class "Container"</p>
    <p>Ini adalah Contoh text dalam class "Container".</p>
</body>

</html>
