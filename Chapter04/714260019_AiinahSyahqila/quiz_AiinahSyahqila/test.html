<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding dan table</title>
    <style>
        table { background-color: #4A2E35;
        color: white;
     }
     td {
        padding: 8px;
     }
     tr {border-bottom: 1px solid #D8B4F8
     }
     tr:hover { background-color: #F3E8FF ;}
     tr:nth-child(even){
        background-color: #D8B4F8;
     }

    </style>
</head>
<body>
    <table>
        <tr>
            <td> halo 1, halo 2</td>
            <td> halo 3, halo 4</td>
        </tr>
        <tr>
            <td> selamat 2, selamat 2</td>
            <td> selamat 3, selamat 3</td>
        </tr>
        <tr>
            <td> siang 1, siang 2</td>
            <td> malam 1, malam 2</td>
        </tr>
    </table>
    
</body>
</html>
