<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tampilan Website Responsif</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0%;
        padding: 0%;
        background-color: rgb(48, 68, 85);
      }

      header {
        background-color: rgb(43, 55, 55);
        color: rgb(79, 134, 127);
        text-align: center;
        padding: 20px;
      }

      nav {
        display: flex;
        justify-content: center;
        background-color: black;
      }

      nav a {
        text-decoration: none;
        color: rgb(85, 107, 112);
        padding: 10px 20px;
      }

      .container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 20px;
        background-color: rgb(90, 140, 154);
        border-radius: 5px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
      }

      .sidebar {
        flex: 30%;
      }

      footer {
        background-color: rgb(62, 88, 90);
        color: rgb(1, 17, 17);
        text-align: center;
        padding: 10px;
      }

      /* Responsiveness*/
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }
        .main-content .sidebar {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SELAMAT DATANG DI WEB SAYA</h1>
    </header>
    <nav>
      <a href="#">Beranda</a>
      <a href="#">Tentang Kami</a>
      <a href="#">Layanan</a>
      <a href="#">Kontak</a>
    </nav>
    <div class="container">
      <div class="main-content">
        <h2>SELAMAT DATANG</h2>
        <p>INI ADALAH CONTOH TEMILAN WEBSIDE SEDERHANA.</p>
      </div>
      <div class="sidebar">
        <h3>Bar Samping</h3>
        <ul>
          <li>Item 1</li>
          <li>Item 2</li>
          <li>Item 3</li>
        </ul>
      </div>
    </div>

    <footer>
      <p>&copy; BRIAN SUDAH PUSING</p>
    </footer>
  </body>
</html>
