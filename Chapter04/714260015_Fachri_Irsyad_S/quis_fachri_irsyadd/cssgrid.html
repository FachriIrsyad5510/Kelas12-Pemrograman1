<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid dan Selector</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item {
            background-color: blueviolet;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }

        .spesial {
            background-color: midnightblue;
        }

        #unique {
            background-color: cyan;
        }

        .container p {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1> CSS dan Selector</h1>
    <div class="container">
        <div class="item">item 1</div>
        <div class="item">item 2</div>
        <div class="item spesial">item 3(spesial)</div>
        <div class="item 4">item 4</div>
        <div class="item 5">item 5</div>
        <div class="item" id="unique">item 6 (unique)</div>
    </div>
    <p> contoh pokokna mah</p>
    <p> contoh teks di luar container</p>

</body>
</html>
