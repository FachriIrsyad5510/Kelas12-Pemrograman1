<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh CSS Border</title>
    <style>
        .border-example {
            width: 200px;
            height: 100px;
            border: 2px solid;
            border-color: lime;
            padding: 10px;
            margin: 20px;
        }

        .custom-border{
            width: 200px;
            height: 100px;
            border-width: 4px;
            border-style: dotted;
            border-color: crimson;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1> Contoh CSS Border</h1>
    <div class="border-example">
        <p> Ini adalah elemen dasar border solid hijau ajalah biar beda.</p>
    </div>

    <div class="custom-border">
        <p> Ini adalah elemen dengan border custom (dotted merah).</p>
    </div>
</body>
</html>
