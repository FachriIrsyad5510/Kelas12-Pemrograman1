<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .item {
            background-color: aqua;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }

        .special {
            background-color: brown;
        }

        #unique {
            background-color: blue;
        }

        .container {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>CSS Grid</h1>
    <div class-="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item special">Item 3 (Special)</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item" id="unique">Item 6 (Unique)</div>
    </div>
    <p>Contoh class container</p>
    <p>Contoh luas container</p>
</body>
</html>
