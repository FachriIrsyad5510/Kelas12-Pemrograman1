name: Deploy personal profile

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'assets/profile.jpg'
      - '.github/workflows/deploy-profile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare profile site
        run: |
          mkdir -p _site/assets
          cp index.html script.js style.css _site/
          cp assets/profile.jpg _site/assets/
      - name: Upload profile site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish profile site
        id: deployment
        uses: actions/deploy-pages@v4
