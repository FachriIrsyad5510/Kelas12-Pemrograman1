<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body>
    <h1>Pendaftaran Mahasiswa TI</h1>
    <form action="submit.php" method="post">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="workshop">Pilih Kelas:</label>
        <select id="workshop" name="workshop" required>
            <option value="">--Pilih Kelas--</option>
            <option value="html">HTML Dasar</option>
            <option value="css">CSS Lanjutan</option>
            <option value="javascript">JavaScript untuk Pemula</option>
        </select><br><br>

        <input type="submit" value="Daftar">
    
</body>
</html>
