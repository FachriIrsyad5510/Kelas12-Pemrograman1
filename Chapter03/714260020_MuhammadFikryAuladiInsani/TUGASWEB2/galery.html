<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        div img{
            width: 400px;
            height: 300px;
            border: 2px solid grey;
            border-radius: 13px;
            box-shadow: 4px 7px 7px 0px #000000;
            cursor: pointer;
            margin: 10px;
            transition: 400ms;
        }
        div img:hover{
            filter: grayscale(1);
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div>
        <img src="WhatsApp Image 2026-10-24 at 00.26.04 (1).jpeg" alt="">
        <img src="WhatsApp Image 2026-10-24 at 00.26.04.jpeg" alt="">
        <img src="WhatsApp Image 2026-10-24 at 00.26.05 (1).jpeg" alt="">
        <img src="WhatsApp Image 2026-10-24 at 00.26.05 (2).jpeg" alt="">
        <img src="WhatsApp Image 2026-10-24 at 00.26.05.jpeg" alt="">
        <img src="WhatsApp Image 2026-10-24 at 00.26.06.jpeg" alt="">
    </div>
</body>
</html>
