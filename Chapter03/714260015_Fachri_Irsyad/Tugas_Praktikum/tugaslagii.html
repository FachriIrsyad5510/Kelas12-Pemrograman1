<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <h1> Pendaftaran Jadi Pemuda Pancasila</h1>
    <form action="submit.php" method="post">
      <div class="input-grup">
        <label for="name">>NAMA:</label>
        <input type="text" id="name" placeholder="Masukkan nama..." required />
        </div>
        <br />
        <label for="email">email:</label>
        <input type="email" id="email" name="email" required/>
        <br />
        <label for="experience">pengalaman:</label>
        <input type="radio" id="beginner" name="experience" value="beginner" />
        <label for="beginner">pemula</label>
        <input
            type="radio"
            id="intermediate"
            name="experience"
            value="intermediate"/>

        <label for="intermediate">menengah</label>
        <input type="radio" id="advance" name="experience" value="advance"/>
        <label for="advance">mahir</label>
        <br />
        <label for="comment">Harapan dari pekerjaan ini:</label>
        <br />
        <textarea id="comment" name="comment" rows="4" cols="50"></textarea>
        <br />

        <input type="submit" value="daftar" />
            
    
</body>
</html>
