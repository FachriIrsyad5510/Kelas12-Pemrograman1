<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input</title>
</head>
<body>
    <h1>Pendaftaran Lomba E-sport</h1>
    <form action="submit.php" method="post">
        <label for="name">Nama Lengkap: </label>
        <input type="text" id="name" name="name" required><br>
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="experience">Pengalaman:</label>
        <input type="radio" name="experience" value="baru" required>
        <label for="beginner">pemula</label>
        <input type="radio" name="experience" value="menengah" required>
        <label for="intermediate">menengah</label>
        <input type="radio" name="experience" value="lanjutan" required>
        <label for="advanced">lanjutan</label>

        <label for="game">Game yang diikuti:</label> <br />
        <textarea id="game" name="game" rows="4" cols="50" required></textarea>

        <input type="submit" value="Daftar">
    </form>
</body>
</html>
