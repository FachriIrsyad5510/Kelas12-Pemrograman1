<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body>
    <h1>Pendaftaran workshop desain grafis</h1>
    <form action="submit.php"method=post>
        <label for="nama">Nama lengkap:</label>
        <input type="text" id="nama" name="nama" required/><br/>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required/><br/>
        <label for="experience">Pengalaman:</label>
        <input type="radio" id="experience" name="experience" value="beginner"/>
        <label for="beginner">Pemula</label>
        <input type="radio" id="experience" name="experience" value="intermediate"/>
        <label for="intermediate">Menengah</label>
        <input type="radio" id="advanced" name="experience" value="advenced" />
        <label for="advanced">mahir</label>

        <label for="comment">harapan dari workshop:</label> <br/>
        <textarea id="comment" name="comment" rows="4" cols="50"></textarea><br/>

        <input type="submit" value="daftar"/>
        </form>
</body>
</html>
