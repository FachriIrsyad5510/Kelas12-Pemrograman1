<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Najmi</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe6f0, #e0c3fc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .foto {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #8fabff, #a68bf0);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: white;
        }
        h1 {
            margin: 10px 0 5px;
            color: #333;
            font-size: 28px;
        }
        h2 {
            margin: 0;
            color: #ff8fab;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 1px;
        }
        p {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            background: linear-gradient(90deg, #ff8fab, #a68bf0);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="foto">N</div>
        <h1>Najmi Afifah J. Siregar</h1>
        <h2>WEB DEVELOPER</h2>
        <p>Hallo kawan! 👋<br><br>
        Hi, I'm Najmi! I'm a web developer passionate about creating beautiful and functional websites.uu
        <br><br>
        Kelas 12 - Pemrograman 1
        </p>
        <a href="#" class="btn">✨ My Portfolio</a>
    </div>
</body>
</html>
