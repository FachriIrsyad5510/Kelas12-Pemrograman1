<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <h2>JavaScript disimpan dibody</h2>
    <p id="demo"></p>
    <script>
        document.getElementById("demo").innerHTML =
        "Selamat Datang, Hallo World! saya belajar JavaScript"
    </script>
<body>
    <h2>apa yang bisa dilakukan dengan JavaScript?</h2>
   
    <p id="demo">JavaScript bisa mengganti konten website.</p>

    <button
     type="button"
     onclick="document.getElementById('demo').innerHTML = ' Hello! Saya JavaScript!'"
    >
    klik saya!
    </button>
<body>
    
</body>
</html>
