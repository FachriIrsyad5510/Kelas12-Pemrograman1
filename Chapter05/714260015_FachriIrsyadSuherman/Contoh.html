<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner HTML JavaScript</title>
    <style>
        .keranjang {
            background-color: orange;
        }

        .belisekarang{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <p> Jual baju murah </p>
    <p> price: Rp.150.000</p>

    <button 
    class="keranjang"
    onclick="alert('Tambahkan ke keranjang')"
    >
        Keranjang
    </button>

    <button
        class="belisekarang"
        onclick="alert('Kalem dagoan...')
        alert('Atos meser')">
        Meuli Ayeuna
    </button>
</body>
</html>
