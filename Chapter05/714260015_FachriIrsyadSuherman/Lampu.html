<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasar Java Script</title>
</head>
<body>
    <h2>Dasar Java Script</h2>

    <p id="document">Ini adalah lampu goblog.</p>

    <button type="button"
    onclick="document.getElementById('myImage').src = 'pic_bulbon.gif'">Nyalakan Lampu</button>
    <img id="myImage" src="pic_bulbon.gif" style="width:100px;" />
    <button
    onclick="document.getElementById('myImage').src = 'pic_bulboff.gif'">Matikan Lampu</button>
</body>
</html>
