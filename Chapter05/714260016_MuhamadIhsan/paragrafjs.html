<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script>
        function myFunction() {
            document.getElementById("demo").innerHTML = "Hallo saya javascript";
        }
        </script>
</head>
<body>
    <h2>Paragraphnya harus berubah siap</h2>
    <p id="demo">Javascript bisa menggantikan konten website.</p>
    <button type="button" onclick="myFunction()">Click Me!</button>
</body>
</html>
