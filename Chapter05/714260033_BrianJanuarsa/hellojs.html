<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dasar Javascript</title>
  </head>
  <body>
    <h2>Apa Yang Dimaksud Javascript?</h2>

    <p id="demo">
      Javascript adalah bahasa pemrograman yang digunakan untuk membuat halaman
      web menjadi interaktif. Javascript dapat digunakan untuk membuat efek
      animasi, validasi form, dan masih banyak lagi.
    </p>
    <button
      type="button"
      onclick="
        document.getElementById('demo').innerHTML =
          'Javascript adalah bahasa pemrograman yang digunakan untuk membuat halaman web menjadi interaktif. Javascript dapat digunakan untuk membuat efek animasi, validasi form, dan masih banyak lagi.'
      "
    >
      Klik Disini
    </button>
  </body>
</html>
