<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InnerHTML JavaScript</title>
    <style>
      .keranjang {
        background-color: #4c06ef;
      }

      .belisekarang {
        background-color: #41b8eb;
      }
    </style>
  </head>
  <body>
    <p>Jual Sepatu Murah</p>
    <p>Price: Rp.150.000</p>

    <button
      class="keranjang"
      onclick="alert('Sepatu berhasil ditambahkan ke keranjang')"
      alter('Tambahkan ke keranjang');
    "
    >
    keranjang
</button>
    <button
      class="belisekarang"
      onclick="alert('Sepatu berhasil dibeli')"
      alter('Beli Sekarang');
    "
    >
      Beli Sekarang
  </body>
</html>
