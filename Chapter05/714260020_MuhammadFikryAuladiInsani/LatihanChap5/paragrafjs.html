<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myFunction() {
            document.getElementById("demo").innerHTML = 
            "yeeee berhasil, ini adalah dari memasukan javascript pada head HTML awas jangan salah ya pa? iya pak ... hehe";
        }
    </script>
</head>
<body>
    <h2>Javascript disimpan di head</h2>
    <p id="demo"></p>
    <button type="button" onclick="myFunction()">Click Disini!</button>
    <script src="script.js"></script>
</body>
</html>
