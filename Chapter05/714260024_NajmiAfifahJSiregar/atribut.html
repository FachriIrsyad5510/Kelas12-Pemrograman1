<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dasar Javascript</title>
</head>
<body>
    <h2>Apa yang bisa dilakukan JavaScript?</h2>
    <p>JavaScript bisa mengganti atribut dari value.</p>
    <p>studi kasus kali ini adalah merumah nilai dari atribut sebuah gambar bola lampu</p>
    <button
     type="button" onclick="document.getElementById('myimage').src='pic_bulbonon.png'">
    >
    nyalakan lampunya
    </button>
    <img id="myimage" src="pic_bulbonoff.png" style="width: 100px;"/>
    <button
     type="button" onclick="document.getElementById('myimage').src='pic_bulbonoff.png'">
    >
    matikan lampunya
    </button>  
    </body>
</html>
