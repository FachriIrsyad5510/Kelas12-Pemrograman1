<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paragraf JavaScript</title>
    <script>
      function myFunction() {
        document.getElementById("demo").innerHTML =
          "Yeee, Berhasil, ini adalah hasil dari memasukkan JavaScript pada Head HTML";
      }
    </script>
  </head>
  <body>
    <h2>Paragrafnya harus berubah siap, Sok di klik dlu button nya</h2>
    <p id="demo">Nyobaan JavaScript yang disimpan pada HEAD</p>
    <button type="button" onclick="myFunction()">Coba Klik</button>
  </body>
</html>
